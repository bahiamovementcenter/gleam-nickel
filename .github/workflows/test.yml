name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - name: Install Nickel
        run: |
          curl -sSfL -o nickel https://github.com/tweag/nickel/releases/download/1.14.0/nickel-x86_64-linux
          chmod +x nickel
          sudo mv nickel /usr/local/bin/nickel
          nickel --version
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test

  # The NIF's own Erlang tests, then the suite again on the native backend.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/ncl_nif
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - run: cargo fmt --check
        working-directory: native/ncl_nif
      - run: cargo clippy --release -- -D warnings
        working-directory: native/ncl_nif
      - run: sh native/ncl_nif/test/run.sh
      - run: gleam deps download
      - run: gleam test
        env:
          NCL_NIF: ${{ github.workspace }}/native/ncl_nif/target/release/libncl_nif
          NCL_TEST_BACKEND: native

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
